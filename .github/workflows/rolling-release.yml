# gemeinstrom-Fork-Variante des upstream-Workflows (eegfaktura/*).
# Delta zum Upstream (bei jedem Upstream-Sync neu anwenden):
#   - Push nach ghcr.io/gemeinstrom/* statt ghcr.io/vfeeg-development/*
#   - Registry-Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-*-Jobs zum Platform-Repo in vfeeg-development entfernt, kein env/**-Trigger
# Die Kommentare unterhalb stammen aus dem Upstream und beschreiben dessen Ziel-Org.

# Scala/sbt mit sbt-native-packager (kein Dockerfile). Build-Stack ist auf
# Apache Pekko migriert (statt Akka BSL) - keine repo.akka.io-Auth noetig,
# Dependencies kommen aus Maven Central.
#
# Pusht ins Development-Tier ghcr.io/vfeeg-development/eegfaktura-kep
# gemaess ADR-0005 (Two-Tier-Image-Registry) im Platform-Repo.
#
# Build-Flow:
#   0. Push-Event: Test-Suite (test.yml, wie die PR-Checks); Build+Push nur wenn gruen.
#      PRs testet pr-checks.yml, hier wird dort nur gebaut.
#   1. setup-java (Temurin 17, matched dockerBaseImage in build.sbt)
#   2. setup-sbt
#   3. GHCR-Login mit VFEEG_DEV_PUSH_PAT (nur push-events, PRs pushen nicht)
#   4. PR-Event:    sbt Docker/publishLocal  (Build-Check, kein Push)
#      Push-Event:  sbt Docker/publish       (Build + Push)
#        - build.sbt setzt dockerUsername := Some("vfeeg-development") und die
#          dockerAliases pushen eegfaktura-kep ebenfalls nach vfeeg-development —
#          kein Override im Workflow mehr noetig.
#
# Image-Pfad: ghcr.io/vfeeg-development/eegfaktura-kep (via dockerAliases) plus
# Default-Alias ghcr.io/vfeeg-development/eda-xp-connector (vom packageName).
#
# Voll-Pipeline Stufe 3: Build + Push + dispatch-deploy zum Platform-Repo.
#
# Vorbedingungen:
#   - VFEEG_DEV_PUSH_PAT-Secret im Source-Repo — Classic PAT mit
#     write:packages auf vfeeg-development (Cross-Org-Push)
#   - PLATFORM_DEPLOY_PAT-Secret im Source-Repo — fuer Cross-Repo-Dispatch
#     (Fine-grained Token 'eegfaktura-platform-dispatch')
#   - Mapping `deploy-eda-xp` in Platform-Workflow deploy-on-dispatch.yml (vorhanden)
#   - K8s-Manifest k8s/70-eda-xp.yaml zeigt auf
#     ghcr.io/vfeeg-development/eegfaktura-kep:latest mit imagePullPolicy: Always

name: Docker Image CI (sbt-native-packager)

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

jobs:
  test:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build-and-push-image:
    needs: test
    # push: only after green tests; pull_request: test is skipped, build check runs — not while a
    # draft (pr-checks.yml tests drafts)
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17.0.19+10'

      - name: Setup sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Cache sbt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/**.sbt', 'project/**.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Login to Container Registry
        # Push cross-org nach vfeeg-development/* (Development-Tier, ADR-0005).
        # GITHUB_TOKEN dieses Repos ist auf eegfaktura/* beschraenkt — daher der
        # Classic-PAT VFEEG_DEV_PUSH_PAT (write:packages auf vfeeg-development).
        # GHCR validiert via Token, nicht via username — github.actor bleibt.
        # PR-Builds duerfen nicht pushen — Login-Step nur bei push.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR via Docker/publishLocal) / Build+Push (push via Docker/publish)
        run: |
          # Kein dockerUsername-Override mehr: build.sbt setzt bereits
          # dockerUsername := Some("vfeeg-development") und die dockerAliases
          # pushen eegfaktura-kep ebenfalls nach vfeeg-development (Development-Tier).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sbt Docker/publishLocal
          else
            sbt Docker/publish
          fi
